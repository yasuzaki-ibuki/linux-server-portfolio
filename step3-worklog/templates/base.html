<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}一覧{% endblock %} | 作業記録・障害報告</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; color: #222; background: #fafafa; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 1.4em; }
    header a { color: inherit; text-decoration: none; }
    .button { display: inline-block; padding: 6px 14px; background: #2b6cb0; color: #fff !important; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f0f0f0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
    .status-open { background: #fff3cd; }
    .status-done { background: #d4edda; }
    .filter { margin-bottom: 12px; }
    dl { background: #fff; padding: 16px; border: 1px solid #ddd; }
    dt { font-weight: bold; margin-top: 14px; }
    dd { margin-left: 0; white-space: pre-wrap; }
    .errors { background: #f8d7da; padding: 8px 8px 8px 28px; border-radius: 4px; }
    .record-form { background: #fff; padding: 16px; border: 1px solid #ddd; }
    .record-form label { display: block; margin-top: 14px; font-weight: bold; }
    .record-form input, .record-form select, .record-form textarea {
      display: block; width: 100%; box-sizing: border-box; margin-top: 4px;
      padding: 6px; font-size: 1em; font-weight: normal; font-family: inherit;
    }
    .record-form button { margin-top: 18px; padding: 8px 20px; font-size: 1em; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">作業記録・障害報告</a></h1>
    <a class="button" href="{{ url_for('new') }}">+ 新規登録</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
