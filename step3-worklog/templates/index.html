{% extends "base.html" %}

{% block content %}
<form class="filter" method="get">
  種別:
  <select name="kind">
    <option value="">すべて</option>
    {% for k in kinds %}
    <option value="{{ k }}" {% if k == kind %}selected{% endif %}>{{ k }}</option>
    {% endfor %}
  </select>

  ステータス:
  <select name="status">
    <option value="">すべて</option>
    {% for s in statuses %}
    <option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>

  <button type="submit">絞り込み</button>
</form>

<p>{{ records|length }}件</p>

<table>
  <tr>
    <th>No.</th>
    <th>発生日時</th>
    <th>種別</th>
    <th>ステータス</th>
    <th>タイトル</th>
  </tr>
  {% for r in records %}
  <tr>
    <td>{{ r.id }}</td>
    <td>{{ r.occurred_at }}</td>
    <td>{{ r.kind }}</td>
    <td>
      <span class="badge {% if r.status == '完了' %}status-done{% else %}status-open{% endif %}">{{ r.status }}</span>
    </td>
    <td><a href="{{ url_for('detail', record_id=r.id) }}">{{ r.title }}</a></td>
  </tr>
  {% else %}
  <tr><td colspan="5">記録がありません</td></tr>
  {% endfor %}
</table>
{% endblock %}
