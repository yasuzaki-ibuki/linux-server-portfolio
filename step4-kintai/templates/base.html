<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}打刻{% endblock %} | 勤怠・日報</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; color: #222; background: #fafafa; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 1.4em; }
    header a { color: inherit; text-decoration: none; }
    nav a { margin-left: 16px; color: #2b6cb0; text-decoration: none; }
    nav a:first-child { margin-left: 0; }
    .panel { background: #fff; border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; }
    .status { font-size: 1.3em; font-weight: bold; }
    .status-none { color: #666; }
    .status-working { color: #2b6cb0; }
    .status-done { color: #2f855a; }
    .buttons { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .buttons button { font-size: 1.1em; padding: 10px 28px; border: none; border-radius: 6px; color: #fff; cursor: pointer; }
    .btn-in { background: #2b6cb0; }
    .btn-out { background: #c05621; }
    .buttons button:disabled { background: #bbb; cursor: not-allowed; }
    .button { display: inline-block; padding: 6px 14px; background: #2b6cb0; color: #fff; border-radius: 4px; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f0f0f0; }
    .sat { color: #2b6cb0; }
    .sun { color: #c53030; }
    .summary { display: flex; gap: 24px; flex-wrap: wrap; }
    .summary div { font-size: 1.1em; }
    .month-nav { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .pre { white-space: pre-wrap; }
    .report-form label { display: block; margin-top: 14px; font-weight: bold; }
    .report-form textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font-size: 1em; font-family: inherit; }
    .report-form button { margin-top: 18px; padding: 8px 20px; font-size: 1em; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">勤怠・日報</a></h1>
    <nav>
      <a href="{{ url_for('index') }}">打刻</a>
      <a href="{{ url_for('reports') }}">日報</a>
      <a href="{{ url_for('monthly') }}">月次集計</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
